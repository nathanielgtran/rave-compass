; rave-compass firmware — PlatformIO project config
; Three environments:
;   native          — host unit tests (Unity framework, no hardware required)
;   l1lite_token    — nRF52840 Wio Tracker L1 Lite, ROLE_TOKEN
;   l1lite_beacon   — nRF52840 Wio Tracker L1 Lite, ROLE_BEACON
;
; Acceptance gate: pio test -e native

[env:native]
platform = native
test_framework = unity
build_flags =
    -std=c++17
    -DNATIVE_TEST
    -DUNITY_INCLUDE_DOUBLE
; Exclude src/ (main.cpp) from native build — it pulls hardware headers
build_src_filter = -<src/>

; NOTE: seeed_xiao_nrf52840 is not in the standard nordicnrf52 platform.
; The Seeed Wio Tracker L1 Lite (nRF52840 + SX1262 + L76K) requires the Seeed BSP
; or a custom board JSON. Using adafruit_feather_nrf52840 as the closest nRF52840
; substitute for compile-check purposes (same MCU, different pin map).
; Swap to seeed_xiao_nrf52840 when the Seeed Arduino BSP is installed on the build host:
;   pio pkg install --platform "https://github.com/Seeed-Studio/Adafruit_nRF52_Arduino"
; or add a custom board definition to boards/.
[env:l1lite_token]
platform = nordicnrf52
board = adafruit_feather_nrf52840
framework = arduino
build_flags =
    -DROLE_TOKEN
    -std=c++17
lib_deps =
    jgromes/RadioLib

[env:l1lite_beacon]
platform = nordicnrf52
board = adafruit_feather_nrf52840
framework = arduino
build_flags =
    -DROLE_BEACON
    -std=c++17
lib_deps =
    jgromes/RadioLib
