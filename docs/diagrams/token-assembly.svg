<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 960 648" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="token-assembly-title token-assembly-desc" id="token-assembly-root">
        <title id="token-assembly-title">Token hardware assembly</title>
        <desc id="token-assembly-desc">Inside the printed case, the Wio Tracker board (MCU, LoRa radio, GNSS) connects to a magnetometer and accelerometer over I2C, a button, a battery over JST, and an LED ring over GPIO; USB-C enters from outside the case.</desc>
        <defs>
      <style>#token-assembly-root { --color-paper:   #F7F5F2;
      --color-ink:     #2C2C2A;
      --color-muted:   #5C5650;
      --color-accent:  #A8482D;
      --font-sans:     system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
      --font-serif:    'Iowan Old Style', Georgia, 'Times New Roman', serif;
      --font-mono:     ui-monospace, 'SF Mono', Menlo, Consolas, monospace; }
      #token-assembly-root { font-family: var(--font-sans); color: var(--color-ink); }
      #token-assembly-root .diagram-container { width: 100%; overflow-x: auto; }
      @media print {
#token-assembly-root .diagram-container { overflow-x: visible; }
}</style>
