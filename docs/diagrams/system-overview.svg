<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 960 520" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="system-overview-title system-overview-desc" id="system-overview-root">
        <title id="system-overview-title">Single-beacon system overview</title>
        <desc id="system-overview-desc">One anchor beacon broadcasts its GPS position over one-way LoRa; any number of receive-only pointer tokens listen, and every device gets its own fix from GPS satellites.</desc>
        <defs>
      <style>#system-overview-root { --color-paper:   #F7F5F2;
      --color-ink:     #2C2C2A;
      --color-muted:   #5C5650;
      --color-accent:  #A8482D;
      --font-sans:     system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
      --font-serif:    'Iowan Old Style', Georgia, 'Times New Roman', serif;
      --font-mono:     ui-monospace, 'SF Mono', Menlo, Consolas, monospace; }
      #system-overview-root { font-family: var(--font-sans); color: var(--color-ink); }
      #system-overview-root .diagram-container { width: 100%; overflow-x: auto; }
      @media print {
#system-overview-root .diagram-container { overflow-x: visible; }
}</style>
          <marker id="system-overview-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#5C5650"/></marker>
          <marker id="system-overview-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#A8482D"/></marker>
          <marker id="system-overview-arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#3B4F5E"/></marker>
          <marker id="system-overview-arrow-open" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polyline points="0 0, 8 3, 0 6" fill="none" stroke="#3B4F5E" stroke-width="1.2"/></marker>
        </defs>

        <rect width="100%" height="100%" fill="#F7F5F2"/>

        <path d="M360,80 H192 Q184,80 184,88 V224" fill="none" stroke="#5C5650" stroke-width="1" stroke-dasharray="5,4" marker-end="url(#system-overview-arrow)"/>
        <path d="M600,80 H768 Q776,80 776,88 V224" fill="none" stroke="#5C5650" stroke-width="1" stroke-dasharray="5,4" marker-end="url(#system-overview-arrow)"/>
        <line x1="312" y1="264" x2="648" y2="264" stroke="#A8482D" stroke-width="1.4" marker-end="url(#system-overview-arrow-accent)"/>
        <rect x="244" y="62" width="56" height="12" rx="2" fill="#F7F5F2"/>
        <text x="272" y="71" fill="#5C5650" font-size="8" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" text-anchor="middle" letter-spacing="0.08em">GNSS FIX</text>
        <rect x="442" y="246" width="76" height="12" rx="2" fill="#F7F5F2"/>
        <text x="480" y="255" fill="#A8482D" font-size="8" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" text-anchor="middle" letter-spacing="0.08em">915 MHZ LORA</text>
        <rect x="442" y="270" width="76" height="12" rx="2" fill="#F7F5F2"/>
        <text x="480" y="279" fill="#A8482D" font-size="8" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" text-anchor="middle" letter-spacing="0.08em">1 HZ · 57 MS</text>
        <rect x="664" y="240" width="256" height="80" rx="6" fill="#F7F5F2" stroke="#2c2c2a" stroke-width="1" stroke-opacity="0.3"/>
        <rect x="656" y="232" width="256" height="80" rx="6" fill="#F7F5F2" stroke="#2c2c2a" stroke-width="1" stroke-opacity="0.3"/>
        <rect x="56" y="224" width="256" height="80" rx="6" fill="#F7F5F2"/>
        <rect x="56" y="224" width="256" height="80" rx="6" fill="#a8482d" stroke="#A8482D" stroke-width="1" fill-opacity="0.08"/>
        <rect x="64" y="232" width="24" height="12" rx="2" fill="none" stroke="#a8482d" stroke-width="0.8" stroke-opacity="0.5"/>
        <text x="76" y="241" fill="#A8482D" font-size="7" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" text-anchor="middle" letter-spacing="0.08em">TX</text>
        <text x="184" y="260" fill="#2C2C2A" font-size="12" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" text-anchor="middle" font-weight="600">Anchor beacon</text>
        <text x="184" y="275" fill="#5C5650" font-size="9" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" text-anchor="middle">on a person or the totem</text>
        <text x="184" y="288" fill="#5C5650" font-size="9" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" text-anchor="middle">position every 1 s</text>
        <rect x="648" y="224" width="256" height="80" rx="6" fill="#F7F5F2"/>
        <rect x="648" y="224" width="256" height="80" rx="6" fill="#FFFFFF" stroke="#2C2C2A" stroke-width="1"/>
        <rect x="656" y="232" width="24" height="12" rx="2" fill="none" stroke="#2c2c2a" stroke-width="0.8" stroke-opacity="0.22"/>
        <text x="668" y="241" fill="#6E6963" font-size="7" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" text-anchor="middle" letter-spacing="0.08em">RX</text>
        <text x="776" y="260" fill="#2C2C2A" font-size="12" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" text-anchor="middle" font-weight="600">Pointer tokens × N</text>
        <text x="776" y="275" fill="#5C5650" font-size="9" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" text-anchor="middle">RX only · never transmit</text>
        <text x="776" y="288" fill="#5C5650" font-size="9" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" text-anchor="middle">LED arrow + distance</text>
        <rect x="360" y="48" width="240" height="64" rx="6" fill="#F7F5F2"/>
        <rect x="360" y="48" width="240" height="64" rx="6" fill="#2c2c2a" stroke="#2c2c2a" stroke-width="1" fill-opacity="0.03" stroke-opacity="0.3"/>
        <rect x="368" y="56" width="32" height="12" rx="2" fill="none" stroke="#2c2c2a" stroke-width="0.8" stroke-opacity="0.22"/>
        <text x="384" y="65" fill="#6E6963" font-size="7" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" text-anchor="middle" letter-spacing="0.08em">GNSS</text>
        <text x="480" y="84" fill="#2C2C2A" font-size="12" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" text-anchor="middle" font-weight="600">GPS satellites</text>
        <text x="480" y="99" fill="#5C5650" font-size="9" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" text-anchor="middle">receive-only · no cell signal</text>
        <line x1="56" y1="360" x2="904" y2="360" stroke="#2c2c2a" stroke-width="0.8" stroke-opacity="0.1"/>
        <text x="56" y="388" fill="#2C2C2A" font-size="14" font-family="'Iowan Old Style', Georgia, 'Times New Roman', serif" font-style="italic">One-way broadcast, SF8/250, encrypted payload. No mesh, no pairing, no phone.</text>
        <text x="56" y="412" fill="#5C5650" font-size="14" font-family="'Iowan Old Style', Georgia, 'Times New Roman', serif" font-style="italic">Tokens never transmit: unlimited listeners, zero congestion. You find the beacon, not individuals.</text>
        <line x1="56" y1="448" x2="904" y2="448" stroke="#2c2c2a" stroke-width="0.8" stroke-opacity="0.1"/>
        <text x="56" y="464" fill="#5C5650" font-size="8" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" letter-spacing="0.18em">LEGEND</text>
        <rect x="56" y="484" width="14" height="10" rx="2" fill="#a8482d" stroke="#A8482D" stroke-width="1" fill-opacity="0.08"/>
        <text x="76" y="493" fill="#5C5650" font-size="8.5" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">Anchor (only transmitter)</text>
        <rect x="264" y="484" width="14" height="10" rx="2" fill="#FFFFFF" stroke="#2C2C2A" stroke-width="1"/>
        <text x="284" y="493" fill="#5C5650" font-size="8.5" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">Token (listener)</text>
        <rect x="424" y="484" width="14" height="10" rx="2" fill="#2c2c2a" stroke="#2c2c2a" stroke-width="1" fill-opacity="0.03" stroke-opacity="0.3"/>
        <text x="444" y="493" fill="#5C5650" font-size="8.5" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">GPS (external)</text>
        <line x1="584" y1="489" x2="612" y2="489" stroke="#A8482D" stroke-width="1.2" marker-end="url(#system-overview-arrow-accent)"/>
        <text x="620" y="493" fill="#5C5650" font-size="8.5" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">LoRa broadcast</text>
        <line x1="744" y1="489" x2="772" y2="489" stroke="#5C5650" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#system-overview-arrow)"/>
        <text x="780" y="493" fill="#5C5650" font-size="8.5" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">GNSS fix (receive)</text>

      </svg>
