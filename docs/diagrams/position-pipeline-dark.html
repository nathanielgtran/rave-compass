<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Position to arrow pipeline</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper:   #1C1B19;
      --color-ink:     #E8E5E1;
      --color-muted:   #AEA9A2;
      --color-accent:  #D06A4C;
      --font-sans:     system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
      --font-serif:    'Iowan Old Style', Georgia, 'Times New Roman', serif;
      --font-mono:     ui-monospace, 'SF Mono', Menlo, Consolas, monospace;
    }
    body {
      font-family: var(--font-sans);
      background: var(--color-paper);
      color: var(--color-ink);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 3rem 2rem;
    }
    .frame { max-width: 1200px; width: 100%; }
    .diagram-container { width: 100%; overflow-x: auto; }
    .eyebrow {
      font-family: var(--font-mono);
      font-size: 0.66rem;
      font-weight: 500;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--color-muted);
      margin-bottom: 0.5rem;
    }
    h1 {
      font-family: var(--font-serif);
      font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem);
      font-weight: 400;
      letter-spacing: -0.02em;
      line-height: 1.15;
      color: var(--color-ink);
      margin-bottom: 1.5rem;
    }
    svg { width: 100%; min-width: 960px; display: block; }
    @media print {
      .diagram-container { overflow-x: visible; }
      svg { min-width: 0; }
    }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Sequence · rave-compass</p>

        <desc id="position-pipeline-dark-desc">Sequence of one second on a token: the anchor transmits a position frame, the token radio hands it to the MCU, which computes bearing and distance and drives the LED ring, with a proximity branch at 30 metres.</desc>

        <text x="56" y="704" fill="#E8E5E1" font-size="14" font-family="'Iowan Old Style', Georgia, 'Times New Roman', serif" font-style="italic">No frame for more than 10 s: the ring drops to a slow blink of the last known position.</text>

    </div>
  </div>
