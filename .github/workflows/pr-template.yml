name: PR template

# Fails a PR whose body skips the fleet template (What / Why / Proof /
# Risk + rollback). Source: nathanielgtran/.github; bump both SHAs together.

on:
  pull_request:
    types: [opened, edited, reopened, synchronize]

permissions:
  contents: read

jobs:
  pr-template:
    uses: nathanielgtran/.github/.github/workflows/pr-template-check.yml@a810707c56aa01753105a56aef25f0d570028e2f
    with:
      ref: a810707c56aa01753105a56aef25f0d570028e2f
      runs_on: '"ubuntu-latest"'
