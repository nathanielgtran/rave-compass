name: review

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

jobs:
  claude-review:
    if: github.event.pull_request.head.repo.full_name == github.repository
    permissions:
      contents: read
      pull-requests: write
    uses: nathanielgtran/do-no-work/.github/workflows/claude-review.yml@083422e109916dcd8026721489411ae1e8583a55 # do-no-work 083422e
    with:
      tools-ref: 083422e109916dcd8026721489411ae1e8583a55
    secrets:
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
